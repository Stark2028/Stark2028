<svg xmlns="http://www.w3.org/2000/svg" width="440" height="250" viewBox="0 0 440 250" role="img" aria-labelledby="t d">
  <title id="t">Gather — Fair, explainable meetups for small groups.</title>
  <desc id="d">Checks every venue and 15-min slot against each person's free time, walking limit and budget. 367 tests, 9 REST APIs, 3 ranked plans. Built with TypeScript, React, AWS Lambda, DynamoDB.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161B22"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" x2="1">
      <stop offset="0" stop-color="#E23636"/>
      <stop offset="1" stop-color="#F5B700"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect x="1" y="1" width="438" height="248" rx="14"/></clipPath>
  </defs>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #E6EDF3; }
    .tag { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #C9D1D9; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; font-size: 13px; fill: #8B949E; }
    .pulse { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .25; } }
  </style>

  <rect x="1" y="1" width="438" height="248" rx="14" fill="url(#bg)" stroke="#30363D" stroke-width="1.5"/>
  <g clip-path="url(#card)">
    <rect x="0" y="0" width="440" height="4" fill="url(#edge)"/>
    <rect x="-140" y="0" width="140" height="4" fill="url(#shine)">
      <animate attributeName="x" from="-140" to="440" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <text x="428" y="272" fill="#E6EDF3" opacity=".04" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'Liberation Mono', Menlo, monospace" font-size="120" font-weight="800" text-anchor="end">02</text>
  </g>

  <text x="24" y="50" fill="#F5B700" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" font-weight="700">02</text>
  <rect x="48" y="37" width="2" height="18" fill="#E23636"/>
  <text x="60" y="53" class="title">Gather</text>

  <rect x="359" y="33" width="59" height="24" rx="12" fill="#0D1117" stroke="#3FB950" stroke-opacity=".55" stroke-width="1.2"/>
  <circle class="pulse" cx="372" cy="45" r="4" fill="#3FB950"/>
  <text x="382" y="45.5" fill="#3FB950" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="700" dominant-baseline="central">LIVE</text>

  <text x="24" y="86" class="tag">Fair, explainable meetups for small groups.</text>
  <text x="24" y="112" class="desc">Checks every venue and 15-min slot against each</text>
  <text x="24" y="130" class="desc">person's free time, walking limit and budget.</text>

  <rect x="24" y="150" width="83" height="24" rx="12" fill="none" stroke="#E23636" stroke-width="1.2"/>
    <text x="65.5" y="162.5" fill="#F5B700" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" text-anchor="middle" dominant-baseline="central">367 tests</text>
    <rect x="114" y="150" width="98" height="24" rx="12" fill="none" stroke="#E23636" stroke-width="1.2"/>
    <text x="163" y="162.5" fill="#F5B700" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" text-anchor="middle" dominant-baseline="central">9 REST APIs</text>
    <rect x="219" y="150" width="119" height="24" rx="12" fill="none" stroke="#E23636" stroke-width="1.2"/>
    <text x="278.5" y="162.5" fill="#F5B700" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" text-anchor="middle" dominant-baseline="central">3 ranked plans</text>

  <line x1="24" y1="194" x2="416" y2="194" stroke="#30363D" stroke-dasharray="2 4"/>
    <rect x="24" y="206" width="84" height="23" rx="11.5" fill="#21262D"/>
    <text x="66" y="218" fill="#C9D1D9" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" text-anchor="middle" dominant-baseline="central">TypeScript</text>
    <rect x="114" y="206" width="51" height="23" rx="11.5" fill="#21262D"/>
    <text x="139.5" y="218" fill="#C9D1D9" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" text-anchor="middle" dominant-baseline="central">React</text>
    <rect x="171" y="206" width="84" height="23" rx="11.5" fill="#21262D"/>
    <text x="213" y="218" fill="#C9D1D9" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" text-anchor="middle" dominant-baseline="central">AWS Lambda</text>
    <rect x="261" y="206" width="71" height="23" rx="11.5" fill="#21262D"/>
    <text x="296.5" y="218" fill="#C9D1D9" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" text-anchor="middle" dominant-baseline="central">DynamoDB</text>
</svg>
