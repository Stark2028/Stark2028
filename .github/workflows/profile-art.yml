name: Generate profile art

# Rebuilds the contribution snake and the 3D contribution calendar, then
# publishes both to the `output` branch so main never collects bot commits.

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-art.yml
      - .github/3d-contrib.json

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#B31217&color_dots=#ebedf0,#ffd8a8,#ff9f68,#e23636,#9b111e
            dist/snake-dark.svg?palette=github-dark&color_snake=#F5B700&color_dots=#1c2128,#5c1a1a,#9b111e,#e23636,#f5b700

      - name: 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/3d-contrib.json

      - name: Collect
        run: cp profile-3d-contrib/*.svg dist/

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update profile art
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
